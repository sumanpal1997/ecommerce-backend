# ShopFlow Studio - Production Nginx Reverse Proxy Configuration

upstream frontend_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream backend_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

# Redirect HTTP to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name shopflow.yourdomain.com api.shopflow.yourdomain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Frontend Storefront Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shopflow.yourdomain.com;

    # SSL Certificates (managed via certbot)
    ssl_certificate /etc/letsencrypt/live/shopflow.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shopflow.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# Backend API Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.shopflow.yourdomain.com;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/api.shopflow.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.shopflow.yourdomain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
